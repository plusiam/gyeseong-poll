<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>기훈이 형님 집들이 날짜 선정</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* ============================
       CSS 변수 및 기본 설정
    ============================ */
    :root {
      --bg: #f5f0e8;
      --card: #fffdf7;
      --ink: #1a1208;
      --ink2: #4a3f2a;
      --ink3: #8a7a60;
      --gold: #c8922a;
      --gold2: #f0c060;
      --green: #2e6b4f;
      --green-light: #d4ede0;
      --red: #c0392b;
      --border: #ddd5c0;
      --shadow: 0 2px 12px rgba(30,20,5,0.10);
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(ellipse at 10% 10%, rgba(200,146,42,0.07) 0%, transparent 60%),
        radial-gradient(ellipse at 90% 90%, rgba(46,107,79,0.07) 0%, transparent 60%);
      min-height: 100vh;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--ink);
      padding: 0 0 60px 0;
    }

    /* ============================
       헤더
    ============================ */
    .header {
      background: var(--ink);
      color: #f5f0e8;
      text-align: center;
      padding: 36px 20px 28px;
      position: relative;
      overflow: hidden;
    }
    .header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        45deg,
        transparent,
        transparent 18px,
        rgba(200,146,42,0.06) 18px,
        rgba(200,146,42,0.06) 19px
      );
    }
    .header-badge {
      display: inline-block;
      font-family: 'Noto Serif KR', serif;
      font-size: 11px;
      letter-spacing: 3px;
      color: var(--gold2);
      border: 1px solid rgba(200,146,42,0.5);
      padding: 4px 14px;
      border-radius: 20px;
      margin-bottom: 14px;
      position: relative;
    }
    .header h1 {
      font-family: 'Noto Serif KR', serif;
      font-size: clamp(20px, 5vw, 28px);
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1.3;
      position: relative;
    }
    .header h1 em {
      color: var(--gold2);
      font-style: normal;
    }
    .header-sub {
      font-size: 13px;
      color: rgba(245,240,232,0.65);
      margin-top: 8px;
      position: relative;
      line-height: 1.8;
    }
    .header-sub span {
      display: inline-block;
      margin: 0 6px;
    }
    .header-sub span::before { content: '·'; margin-right: 6px; opacity: 0.5; }
    .header-sub span:first-child::before { display: none; }

    /* ============================
       메인 컨테이너
    ============================ */
    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 16px;
    }

    /* ============================
       안내 카드
    ============================ */
    .info-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--gold);
      border-radius: var(--radius);
      padding: 16px 20px;
      margin: 24px 0 20px;
      box-shadow: var(--shadow);
      display: flex;
      gap: 14px;
      align-items: flex-start;
    }
    .info-icon {
      font-size: 22px;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .info-text {
      font-size: 13.5px;
      line-height: 1.75;
      color: var(--ink2);
    }
    .info-text strong { color: var(--ink); font-weight: 700; }

    /* ============================
       이름 입력
    ============================ */
    .name-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 20px 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      color: var(--ink3);
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .name-input {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      font-family: 'Noto Sans KR', sans-serif;
      font-size: 15px;
      color: var(--ink);
      background: var(--bg);
      outline: none;
      transition: border-color 0.2s;
    }
    .name-input:focus {
      border-color: var(--gold);
      background: #fff;
    }
    .name-input::placeholder { color: var(--ink3); }

    /* ============================
       날짜 선택 그리드
    ============================ */
    .dates-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 20px 18px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
    }
    .dates-hint {
      font-size: 12.5px;
      color: var(--ink3);
      margin-bottom: 14px;
    }
    .dates-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 8px;
    }
    .date-btn {
      position: relative;
      cursor: pointer;
      user-select: none;
    }
    .date-btn input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }
    .date-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 8px 10px;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      transition: all 0.15s ease;
      text-align: center;
      gap: 4px;
    }
    .date-label:hover {
      border-color: var(--gold);
      background: #fff;
      transform: translateY(-1px);
      box-shadow: 0 3px 10px rgba(200,146,42,0.15);
    }
    .date-day {
      font-size: 15px;
      font-weight: 700;
      color: var(--ink);
      font-family: 'Noto Serif KR', serif;
    }
    .date-dow {
      font-size: 11px;
      color: var(--ink3);
      font-weight: 400;
    }
    .date-mark {
      font-size: 16px;
      height: 18px;
      color: transparent;
      transition: color 0.15s;
    }

    /* 선택된 날짜 스타일 */
    .date-btn input:checked + .date-label {
      background: var(--green);
      border-color: var(--green);
      transform: translateY(-1px);
      box-shadow: 0 3px 12px rgba(46,107,79,0.25);
    }
    .date-btn input:checked + .date-label .date-day { color: #fff; }
    .date-btn input:checked + .date-label .date-dow { color: rgba(255,255,255,0.75); }
    .date-btn input:checked + .date-label .date-mark { color: #7effc0; }

    /* 주말 강조 */
    .date-btn.weekend .date-dow { color: #c0392b; }
    .date-btn.weekend input:checked + .date-label .date-dow { color: rgba(255,180,180,0.9); }

    /* ============================
       제출 버튼
    ============================ */
    .submit-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin: 20px 0 28px;
    }
    .btn-submit {
      width: 100%;
      max-width: 340px;
      padding: 15px;
      background: var(--ink);
      color: var(--gold2);
      border: none;
      border-radius: var(--radius);
      font-family: 'Noto Serif KR', serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 4px 16px rgba(30,20,5,0.2);
      position: relative;
      overflow: hidden;
    }
    .btn-submit:hover {
      background: #2e2010;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(30,20,5,0.28);
    }
    .btn-submit:active { transform: translateY(0); }
    .btn-submit:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .submit-note {
      font-size: 12px;
      color: var(--ink3);
    }

    /* ============================
       상태 메시지
    ============================ */
    .status-msg {
      display: none;
      padding: 13px 18px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      text-align: center;
      margin-bottom: 16px;
      animation: fadeIn 0.3s ease;
    }
    .status-msg.success {
      display: block;
      background: var(--green-light);
      color: var(--green);
      border: 1px solid #a0d4b8;
    }
    .status-msg.error {
      display: block;
      background: #fde8e6;
      color: var(--red);
      border: 1px solid #f5b8b4;
    }
    .status-msg.loading {
      display: block;
      background: #f0ead8;
      color: var(--ink2);
      border: 1px solid var(--border);
    }

    /* ============================
       결과 섹션
    ============================ */
    .result-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px 20px 18px;
      box-shadow: var(--shadow);
    }
    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .result-total {
      font-size: 12.5px;
      color: var(--ink3);
      background: var(--bg);
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .result-total strong { color: var(--gold); font-weight: 700; }
    .result-list { display: flex; flex-direction: column; gap: 8px; }
    .result-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .result-date {
      font-size: 13px;
      font-weight: 500;
      color: var(--ink2);
      min-width: 74px;
      flex-shrink: 0;
    }
    .result-bar-wrap {
      flex: 1;
      background: #ece8de;
      border-radius: 4px;
      height: 20px;
      overflow: hidden;
      position: relative;
    }
    .result-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--green) 0%, #3d8c65 100%);
      border-radius: 4px;
      transition: width 0.7s cubic-bezier(0.4,0,0.2,1);
      min-width: 0;
    }
    .result-bar.top {
      background: linear-gradient(90deg, var(--gold) 0%, #e0a030 100%);
    }
    .result-count {
      font-size: 13px;
      font-weight: 700;
      color: var(--ink2);
      min-width: 28px;
      text-align: right;
      flex-shrink: 0;
    }
    .result-count.top { color: var(--gold); }
    .result-row.top .result-date { font-weight: 700; color: var(--ink); }

    /* 최다 득표 배지 */
    .top-badge {
      font-size: 10px;
      background: var(--gold);
      color: #fff;
      padding: 2px 7px;
      border-radius: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      flex-shrink: 0;
    }

    /* 결과 없음 */
    .no-result {
      text-align: center;
      padding: 24px 0 10px;
      color: var(--ink3);
      font-size: 14px;
    }

    /* 새로고침 버튼 */
    .btn-refresh {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 12px;
      color: var(--ink3);
      background: none;
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 4px 11px;
      cursor: pointer;
      font-family: 'Noto Sans KR', sans-serif;
      transition: all 0.15s;
    }
    .btn-refresh:hover {
      color: var(--ink2);
      border-color: var(--ink3);
      background: var(--bg);
    }
    .spin { display: inline-block; }
    .spin.rotating { animation: spin 0.8s linear infinite; }

    /* ============================
       애니메이션
    ============================ */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ============================
       반응형
    ============================ */
    @media (max-width: 400px) {
      .dates-grid { grid-template-columns: repeat(3, 1fr); }
      .header h1 { font-size: 18px; }
    }
  </style>
</head>
<body>

<!-- 헤더 -->
<div class="header">
  <div class="header-badge">🎓 2026 계성 교대 동문회</div>
  <h1>기훈이 형님 <em>집들이</em> 날짜 선정</h1>
  <div class="header-sub">
    <span>17:00~</span>
    <span>대구 남구 힐스테이트대명센트럴2차 101동 3602호</span>
  </div>
</div>

<div class="container">

  <!-- 안내 -->
  <div class="info-card">
    <div class="info-icon">📋</div>
    <div class="info-text">
      <strong>가능한 날짜를 모두 선택</strong>해 주세요 (복수 선택 가능)<br>
      최다 참석 가능일로 날짜가 확정됩니다.<br>
      장소·세부 일정은 추후 공지 예정입니다.
    </div>
  </div>

  <!-- 이름 입력 -->
  <div class="name-section">
    <div class="section-label">참석자 이름</div>
    <input
      type="text"
      id="nameInput"
      class="name-input"
      placeholder="이름을 입력해 주세요"
      maxlength="10"
      autocomplete="off"
    >
  </div>

  <!-- 날짜 선택 -->
  <div class="dates-section">
    <div class="section-label">가능한 날짜 선택 <span style="color:var(--gold);font-size:11px;">(3월 25일 ~ 4월 5일)</span></div>
    <div class="dates-hint">가능한 날짜를 모두 클릭해 주세요 ○</div>
    <div class="dates-grid" id="datesGrid">
      <!-- JS로 동적 생성 -->
    </div>
  </div>

  <!-- 상태 메시지 -->
  <div class="status-msg" id="statusMsg"></div>

  <!-- 제출 -->
  <div class="submit-area">
    <button class="btn-submit" id="submitBtn" onclick="submitVote()">
      ✓ 투표 제출하기
    </button>
    <div class="submit-note">* 같은 이름으로 재제출하면 이전 응답이 업데이트됩니다</div>
  </div>

  <!-- 결과 -->
  <div class="result-section">
    <div class="result-header">
      <div class="section-label" style="margin-bottom:0">📊 실시간 현황</div>
      <div style="display:flex;align-items:center;gap:8px;">
        <div class="result-total" id="totalCount">참여자 <strong>0</strong>명</div>
        <button class="btn-refresh" onclick="loadResults()">
          <span class="spin" id="refreshIcon">↻</span> 새로고침
        </button>
      </div>
    </div>
    <div class="result-list" id="resultList">
      <div class="no-result">투표 결과를 불러오는 중...</div>
    </div>
  </div>

</div>

<script>
  // ==========================================
  // 설정값
  // ==========================================

  // Apps Script 웹 앱 URL
  const API_URL = 'https://script.google.com/macros/s/AKfycbyXV2st54abrAPlMZ0YWVHWtt6zwflyI9z1hQG12A-E62AU0gyWgYMrxuS9GAKkbnBFVA/exec';

  // 날짜 목록 (날짜 | 요일 | 주말여부)
  const DATES = [
    { key: '3/25(수)', day: '3/25', dow: '수' },
    { key: '3/26(목)', day: '3/26', dow: '목' },
    { key: '3/27(금)', day: '3/27', dow: '금' },
    { key: '3/28(토)', day: '3/28', dow: '토', weekend: true },
    { key: '3/29(일)', day: '3/29', dow: '일', weekend: true },
    { key: '3/30(월)', day: '3/30', dow: '월' },
    { key: '3/31(화)', day: '3/31', dow: '화' },
    { key: '4/1(수)',  day: '4/1',  dow: '수' },
    { key: '4/2(목)',  day: '4/2',  dow: '목' },
    { key: '4/3(금)',  day: '4/3',  dow: '금' },
    { key: '4/4(토)',  day: '4/4',  dow: '토', weekend: true },
    { key: '4/5(일)',  day: '4/5',  dow: '일', weekend: true },
  ];

  // ==========================================
  // 날짜 버튼 생성
  // ==========================================
  function buildDateGrid() {
    const grid = document.getElementById('datesGrid');
    grid.innerHTML = DATES.map((d, i) => `
      <label class="date-btn ${d.weekend ? 'weekend' : ''}">
        <input type="checkbox" name="date" value="${d.key}" id="d${i}">
        <div class="date-label">
          <span class="date-day">${d.day}</span>
          <span class="date-dow">${d.dow}</span>
          <span class="date-mark">○</span>
        </div>
      </label>
    `).join('');
  }

  // ==========================================
  // 투표 제출
  // ==========================================
  async function submitVote() {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) {
      showStatus('이름을 입력해 주세요 😊', 'error');
      document.getElementById('nameInput').focus();
      return;
    }

    // 선택된 날짜 수집
    const selected = [...document.querySelectorAll('input[name="date"]:checked')]
      .map(el => el.value);

    if (selected.length === 0) {
      showStatus('가능한 날짜를 하나 이상 선택해 주세요!', 'error');
      return;
    }

    // 버튼 비활성화
    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = '제출 중...';
    showStatus('투표를 저장하고 있습니다...', 'loading');

    try {
      // Apps Script는 CORS 때문에 no-cors 사용
      await fetch(API_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, dates: selected })
      });

      showStatus(`✓ ${name}님의 투표가 저장되었습니다! (${selected.length}개 날짜 선택)`, 'success');
      btn.textContent = '✓ 제출 완료!';

      // 결과 새로고침
      setTimeout(() => loadResults(), 1200);

      // 3초 후 버튼 복구
      setTimeout(() => {
        btn.disabled = false;
        btn.textContent = '✓ 투표 제출하기';
      }, 3000);

    } catch (err) {
      showStatus('오류가 발생했습니다. 잠시 후 다시 시도해 주세요.', 'error');
      btn.disabled = false;
      btn.textContent = '✓ 투표 제출하기';
    }
  }

  // ==========================================
  // 결과 불러오기
  // ==========================================
  async function loadResults() {
    const icon = document.getElementById('refreshIcon');
    icon.classList.add('rotating');

    try {
      const res = await fetch(API_URL + '?t=' + Date.now());
      const data = await res.json();

      document.getElementById('totalCount').innerHTML =
        `참여자 <strong>${data.total}</strong>명`;

      renderResults(data.counts, data.total);
    } catch (err) {
      document.getElementById('resultList').innerHTML =
        '<div class="no-result">결과를 불러오지 못했습니다. 새로고침 버튼을 눌러주세요.</div>';
    } finally {
      icon.classList.remove('rotating');
    }
  }

  // ==========================================
  // 결과 렌더링
  // ==========================================
  function renderResults(counts, total) {
    const list = document.getElementById('resultList');

    if (!counts || total === 0) {
      list.innerHTML = '<div class="no-result">아직 투표한 분이 없습니다. 첫 번째로 투표해 보세요! 🙂</div>';
      return;
    }

    // 최다 득표 찾기
    const maxCount = Math.max(...DATES.map(d => counts[d.key] || 0));

    list.innerHTML = DATES.map(d => {
      const cnt = counts[d.key] || 0;
      const pct = maxCount > 0 ? (cnt / maxCount) * 100 : 0;
      const isTop = cnt === maxCount && cnt > 0;

      return `
        <div class="result-row ${isTop ? 'top' : ''}">
          <div class="result-date">${d.day}(${d.dow})</div>
          <div class="result-bar-wrap">
            <div class="result-bar ${isTop ? 'top' : ''}" style="width:${pct}%"></div>
          </div>
          <div class="result-count ${isTop ? 'top' : ''}">${cnt}명</div>
          ${isTop ? '<div class="top-badge">최다</div>' : '<div style="min-width:30px"></div>'}
        </div>
      `;
    }).join('');
  }

  // ==========================================
  // 상태 메시지 표시
  // ==========================================
  function showStatus(msg, type) {
    const el = document.getElementById('statusMsg');
    el.textContent = msg;
    el.className = 'status-msg ' + type;
    // 성공/에러는 4초 후 자동 숨김
    if (type !== 'loading') {
      setTimeout(() => { el.className = 'status-msg'; }, 4000);
    }
  }

  // ==========================================
  // 초기 실행
  // ==========================================
  buildDateGrid();
  loadResults();

  // 30초마다 결과 자동 갱신
  setInterval(loadResults, 30000);
</script>
